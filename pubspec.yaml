name: chewie
description: A video player for Flutter with Cupertino and Material play controls
version: 1.10.0
homepage: https://github.com/fluttercommunity/chewie

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  provider: ^6.1.2
  video_player:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/video_player/video_player"
      ref: "br_video_player-v2.9.2_ohos"
  wakelock_plus:
    git:
      url: "https://gitcode.com/muxi_jinnian/fluttertpc_wakelock_plus.git"
      ref: "br_wakelock_plus_1.2.8_ohos"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
